    <!-- Apply the saved/system theme before first paint, so there's no flash
         of the wrong colours. Mirrors the logic in src/utils/theme.ts. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('mt-theme');
          var theme = saved === 'light' || saved === 'dark' ? saved : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
